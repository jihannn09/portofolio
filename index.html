<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <!-- Bunga jatuh -->
  <div id="flowers"></div>

  <main class="login-page">

    <div class="login-card">

      <!-- Logo -->
      <div class="logo">
        ♡
      </div>

      <!-- Judul -->
      <p class="eyebrow">
        PROFIL PUBLIK
      </p>

      <h1>
        Haii, selamat datang! ♡
      </h1>

      <p class="subtitle">
        Lihat profil, keahlian, pendidikan,
        pengalaman, dan karya saya.
      </p>

      <!-- Tombol masuk -->
      <button id="loginButton">

        <span id="buttonText">
          Masuk ke Profil →
        </span>

        <span id="loadingText" hidden>
          Tunggu sebentar... ✦
        </span>

      </button>

      <p class="hint">
        profil • karya • pengalaman
      </p>

    </div>

  </main>

  <script src="login.js"></script>

</body>

</html>
